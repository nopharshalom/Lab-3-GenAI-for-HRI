[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"


[project]
name = "lego_coach"
version = "0.1.0"
description = "A Reachy Mini coach that checks a student's LEGO build step by step with MediaPipe and a vision-language model."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "reachy-mini",
    "mediapipe>=0.10.14",
    "ai-edge-litert",
    "opencv-python",
    "openai",
    "python-dotenv",
    "pyttsx3",
    "pydantic",
]
keywords = ["reachy-mini-app"]

[project.entry-points."reachy_mini_apps"]
lego_coach = "lego_coach.main:LegoCoach"

[tool.setuptools]
package-dir = { "" = "." }
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
lego_coach = ["**/*"] # Also include all non-.py files